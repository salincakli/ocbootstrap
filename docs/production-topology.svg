<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <defs>
    <marker id="p-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker>
    <marker id="p-arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
    <marker id="p-arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
  </defs>

  <rect width="940" height="470" rx="12" fill="#0d1117"/>
  <text x="470" y="34" text-anchor="middle" fill="#8b949e" font-size="13">production topology · api.surstreaming.live · migrated from Coolify/Vultr in one evening</text>

  <!-- clients -->
  <rect x="30" y="150" width="150" height="80" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <text x="105" y="184" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="bold">clients</text>
  <text x="105" y="204" text-anchor="middle" fill="#8b949e" font-size="11">browser · TikTok tooling</text>

  <!-- Vercel DNS -->
  <rect x="240" y="60" width="170" height="52" rx="8" fill="#161b22" stroke="#bc8cff" stroke-width="1.2"/>
  <text x="325" y="82" text-anchor="middle" fill="#bc8cff" font-size="12" font-weight="bold">Vercel DNS</text>
  <text x="325" y="100" text-anchor="middle" fill="#8b949e" font-size="11">CNAME api → LB hostname</text>

  <!-- UpCloud LB -->
  <rect x="480" y="120" width="220" height="140" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="590" y="148" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="bold">UpCloud Managed LB</text>
  <text x="590" y="168" text-anchor="middle" fill="#8b949e" font-size="11">Essentials tier · $0/mo</text>
  <text x="590" y="192" text-anchor="middle" fill="#e6edf3" font-size="12">:443 TLS termination</text>
  <text x="590" y="212" text-anchor="middle" fill="#e6edf3" font-size="12">:80 ACME + redirects</text>
  <text x="590" y="236" text-anchor="middle" fill="#3fb950" font-size="11">member-toggle rollbacks, no DNS waits</text>

  <!-- arrows: clients -> DNS -> LB -->
  <path d="M 180 190 C 215 175, 225 110, 240 92" fill="none" stroke="#bc8cff" stroke-width="1.5"/>
  <path d="M 410 92 C 445 108, 450 130, 480 152" fill="none" stroke="#58a6ff" stroke-width="1.6" marker-end="url(#p-arr)"/>
  <text x="300" y="160" fill="#8b949e" font-size="11">api.surstreaming.live</text>

  <!-- Temps origin box -->
  <rect x="770" y="70" width="150" height="330" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="845" y="98" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="bold">Temps origin</text>
  <text x="845" y="116" text-anchor="middle" fill="#8b949e" font-size="11">up.sahin.tech</text>

  <rect x="785" y="134" width="120" height="44" rx="7" fill="#0d1117" stroke="#3fb950" stroke-width="1"/>
  <text x="845" y="153" text-anchor="middle" fill="#e6edf3" font-size="11">nginx shim :8443</text>
  <text x="845" y="169" text-anchor="middle" fill="#8b949e" font-size="10">SNI-aware re-proxy</text>

  <rect x="785" y="196" width="120" height="44" rx="7" fill="#0d1117" stroke="#3fb950" stroke-width="1"/>
  <text x="845" y="215" text-anchor="middle" fill="#e6edf3" font-size="11">Temps proxy :443</text>
  <text x="845" y="231" text-anchor="middle" fill="#8b949e" font-size="10">routes by SNI/Host</text>

  <rect x="785" y="258" width="120" height="44" rx="7" fill="#0d1117" stroke="#3fb950" stroke-width="1"/>
  <text x="845" y="277" text-anchor="middle" fill="#e6edf3" font-size="11">trae app :12000</text>
  <text x="845" y="293" text-anchor="middle" fill="#8b949e" font-size="10">Litestar · SSE · SAQ</text>

  <rect x="785" y="320" width="56" height="40" rx="6" fill="#0d1117" stroke="#8b949e" stroke-width="1"/>
  <text x="813" y="344" text-anchor="middle" fill="#8b949e" font-size="10">pg</text>
  <rect x="849" y="320" width="56" height="40" rx="6" fill="#0d1117" stroke="#8b949e" stroke-width="1"/>
  <text x="877" y="344" text-anchor="middle" fill="#8b949e" font-size="10">redis</text>

  <path d="M 845 178 L 845 196" stroke="#3fb950" stroke-width="1.4" marker-end="url(#p-arr-g)"/>
  <path d="M 845 240 L 845 258" stroke="#3fb950" stroke-width="1.4" marker-end="url(#p-arr-g)"/>
  <path d="M 820 302 L 815 320" stroke="#8b949e" stroke-width="1.2" marker-end="url(#p-arr-r)"/>
  <path d="M 868 302 L 873 320" stroke="#8b949e" stroke-width="1.2" marker-end="url(#p-arr-r)"/>

  <!-- LB -> origin arrows -->
  <path d="M 700 165 C 720 160, 735 156, 770 156" fill="none" stroke="#58a6ff" stroke-width="1.6" marker-end="url(#p-arr)"/>
  <text x="733" y="146" fill="#8b949e" font-size="10">:8443 TLS</text>
  <path d="M 700 230 C 720 235, 735 240, 762 243" fill="none" stroke="#d29922" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#p-arr)"/>
  <text x="700" y="258" fill="#d29922" font-size="10">:80 ACME + redirects</text>

  <!-- hummingbird rollback member -->
  <rect x="330" y="330" width="250" height="86" rx="10" fill="#161b22" stroke="#8b949e" stroke-dasharray="6 4" stroke-width="1.2" opacity="0.75"/>
  <text x="455" y="360" text-anchor="middle" fill="#8b949e" font-size="13" font-weight="bold">hummingbird (Vultr + Coolify)</text>
  <text x="455" y="380" text-anchor="middle" fill="#8b949e" font-size="11">old production · kept warm</text>
  <text x="455" y="400" text-anchor="middle" fill="#f85149" font-size="11" font-weight="bold">LB member: DISABLED — rollback = flip</text>

  <path d="M 520 260 C 500 285, 480 305, 455 330" fill="none" stroke="#8b949e" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#p-arr-r)"/>

  <!-- footer -->
  <text x="470" y="450" text-anchor="middle" fill="#8b949e" font-size="12">nightly pg_dump + redis backups on origin · LE certs auto-renewed via port-80 challenge path</text>
  <text x="470" y="452" text-anchor="middle" fill="#0d1117" font-size="4">.</text>
</svg>
